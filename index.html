<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thời Khóa Biểu Của Con</title>
  <meta name="description" content="Hệ thống theo dõi lịch học tập và sinh hoạt mỗi ngày dành cho gia đình">
  
  <!-- CSS Giao diện chuẩn, ấm cúng, hoàn toàn không neon -->
  <link rel="stylesheet" href="./css/style.css">
  
  <!-- Firebase SDK v8 (Cố định & Ổn định) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="page-wrapper">
    <!-- KHUNG ĐẦU TRANG -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Thời Khóa Biểu Của Con
        </div>

        <!-- NÚT VÀO QUẢN TRỊ TRÊN HEADER (Không lộ mật khẩu) -->
        <a href="./admin.html" class="btn-admin-link" title="Đến trang quản lý lịch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Quản Lý Lịch
        </a>
      </div>

      <h1 class="header-title">Lịch Học & Sinh Hoạt</h1>
      <p class="header-desc">Theo dõi lịch học tập và sinh hoạt mỗi ngày</p>

      <!-- ĐỒNG HỒ & NGÀY THÁNG TIẾNG VIỆT -->
      <div class="live-time-box">
        <span id="live-date">Đang tải ngày...</span>
        <span class="live-clock-badge">
          <span class="live-dot"></span>
          <span id="live-clock">--:--:--</span>
        </span>
      </div>

      <!-- THANH LỌC THỨ TRONG TUẦN -->
      <div class="filter-tabs" id="filter-tabs"></div>
    </header>

    <!-- NỘI DUNG LỊCH HỌC CÁC NGÀY -->
    <main class="schedule-container" id="schedule-container">
      <div class="loading-box">
        <div class="loading-spinner"></div>
        <p>Đang đồng bộ dữ liệu thời gian thực...</p>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="app-footer">
      <p>Dữ liệu được cập nhật trực tiếp theo thời khóa biểu thực tế</p>
    </footer>
  </div>

  <!-- NÚT NỔI ADMIN DỄ BẤM TRÊN ĐIỆN THOẠI -->
  <a href="./admin.html" class="floating-admin-btn" title="Vào trang quản lý">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
    Quản Trị
  </a>

  <!-- CẤU HÌNH & CODE JS -->
  <script src="./js/firebase-config.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
