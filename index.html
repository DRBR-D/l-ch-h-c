<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thời Khóa Biểu</title>
  <meta name="description" content="Thời khóa biểu học tập và sinh hoạt - Giao diện hiện đại, rõ ràng, dễ theo dõi">
  
  <!-- Font chữ hiện đại, sắc nét, chuẩn quốc tế -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Giao diện hiện đại, sang trọng, tinh tế -->
  <link rel="stylesheet" href="./css/style.css">
  
  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="page-wrapper">
    <!-- HEADER HIỆN ĐẠI, SANG TRỌNG -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Thời Khóa Biểu
        </div>

        <div class="header-actions">
          <!-- TÙY CHỌN CỠ CHỮ DỄ ĐỌC (ACCESSIBILITY) -->
          <button type="button" class="btn-text-size-toggle" id="btn-text-size" onclick="toggleTextSize()" title="Chuyển đổi cỡ chữ">
            <span class="text-size-icon">Aa</span>
            <span class="text-size-label" id="text-size-label">Chữ lớn</span>
          </button>

          <!-- NÚT VÀO QUẢN TRỊ TRANG NHÃ -->
          <a href="./admin.html" class="btn-admin-link" title="Đến trang quản lý">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Quản lý</span>
          </a>
        </div>
      </div>

      <h1 class="header-title">Lịch Học & Sinh Hoạt</h1>
      <p class="header-desc">Hệ thống theo dõi thời khóa biểu học tập chi tiết</p>

      <!-- ĐỒNG HỒ & NGÀY THÁNG SẮC NÉT -->
      <div class="live-time-card">
        <div class="live-date-section">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span id="live-date">Đang tải ngày...</span>
        </div>
        <div class="live-clock-badge">
          <span class="live-dot"></span>
          <span id="live-clock">--:--:--</span>
        </div>
      </div>

      <!-- THANH LỌC CHỌN NGÀY DẠNG PILL TABS HIỆN ĐẠI -->
      <div class="filter-section">
        <div class="filter-tabs" id="filter-tabs">
          <!-- Render các nút lọc: Tất cả, Hôm nay, Ngày mai, Thứ 2 - CN -->
        </div>
      </div>
    </header>

    <!-- NỘI DUNG LỊCH HỌC TỪNG NGÀY -->
    <main class="schedule-container" id="schedule-container">
      <div class="loading-box">
        <div class="loading-spinner"></div>
        <p>Đang đồng bộ dữ liệu thời gian thực...</p>
      </div>
    </main>

    <!-- FOOTER TINH TẾ -->
    <footer class="app-footer">
      <div class="footer-card">
        <p class="footer-sync-note">Dữ liệu được cập nhật tự động theo thời gian thực</p>
        <div class="footer-admin-link-wrap">
          <a href="./admin.html" class="footer-admin-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            Truy cập trang quản trị
          </a>
        </div>
      </div>
    </footer>
  </div>

  <!-- CẤU HÌNH & CODE JS -->
  <script src="./js/firebase-config.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
